<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的静态站点</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        text-align: center;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        padding: 48px 64px;
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      }
      h1 {
        margin-bottom: 12px;
        font-size: 2.5rem;
      }
      p {
        margin: 0;
        opacity: 0.9;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>欢迎</h1>
      <p>这是一个通过 GitHub Pages 托管的静态站点。</p>
    </div>
  </body>
</html>
